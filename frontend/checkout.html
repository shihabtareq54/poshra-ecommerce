<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | POSHRA (পসরা)</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="shared-header"></div>

    <main class="container page-container">
        <div class="breadcrumb"><a href="index.html">Home</a> / <a href="cart.html">Cart</a> / <span>Checkout</span></div>

        <div class="checkout-layout">
            <!-- বামে: ডেলিভারি তথ্য ও পেমেন্ট অপশন -->
            <div class="panel-card">
                <h2 style="margin-bottom:18px;">🚚 Delivery & Payment</h2>
                <div id="checkout-form">
                    <div class="form-field">
                        <label>Full Delivery Address</label>
                        <textarea id="shipping-address" rows="3" placeholder="House, Road, Area, City (e.g. House 12, Road 5, Uttara, Dhaka)"></textarea>
                    </div>
                    <div class="form-field">
                        <label>Contact Phone Number</label>
                        <input type="text" id="shipping-phone" placeholder="e.g. 01711000000">
                    </div>

                    <div class="form-field">
                        <label>Select Payment Method</label>
                        <div style="border:1.5px solid #3749bb; background:#eef2ff; padding:12px 14px; border-radius:8px;">
                            <label style="display:flex; align-items:center; gap:10px; margin:0; cursor:pointer; color:#111827;">
                                <input type="radio" name="payment_method" value="sslcommerz" checked style="width:auto; margin:0;">
                                <strong>Online Payment via SSLCommerz</strong>
                            </label>
                            <div style="font-size:12.5px; color:#4b5563; margin-top:4px; margin-left:24px;">
                                Pay securely with bKash, Nagad, Rocket, Visa, MasterCard & Net Banking
                            </div>
                        </div>
                    </div>

                    <button type="button" onclick="handleCheckout()" class="btn-accent full-width" id="pay-btn" style="padding:13px; font-size:15px;">
                        🔒 Confirm & Pay via SSLCommerz
                    </button>
                </div>
                <div id="checkout-error" class="error-box"></div>
            </div>

            <!-- ডানে: অর্ডার সামারি -->
            <div class="panel-card">
                <h3 style="margin-bottom:16px;">Order Review</h3>
                <div id="checkout-items"><p>Loading summary...</p></div>
                <div class="summary-row summary-total" style="margin-top:14px;">
                    <span>Total Payable</span>
                    <span id="checkout-total">৳0</span>
                </div>
            </div>
        </div>
    </main>

    <div id="shared-footer"></div>

    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initSharedLayout();
            if (!requireAuth()) return;
            loadCheckoutSummary();
        });

        async function loadCheckoutSummary() {
            const token = localStorage.getItem('auth_token');
            const itemsEl = document.getElementById('checkout-items');
            const res = await fetch(`${API_BASE}/cart/`, {
                headers: { 'Authorization': `Token ${token}` }
            });
            const cart = await res.json();

            if (!cart.items || cart.items.length === 0) {
                window.location.href = 'cart.html';
                return;
            }

            itemsEl.innerHTML = cart.items.map(item => `
                <div class="summary-row">
                    <span>${item.quantity}x ${escapeHTML(item.product_name)}</span>
                    <strong>৳ ${Number(item.subtotal).toLocaleString()}</strong>
                </div>
            `).join('');
            document.getElementById('checkout-total').innerText = `৳ ${Number(cart.total_price).toLocaleString()}`;
        }

        async function handleCheckout() {
            const address = document.getElementById('shipping-address').value.trim();
            const phone = document.getElementById('shipping-phone').value.trim();
            const errBox = document.getElementById('checkout-error');
            const btn = document.getElementById('pay-btn');

            if (!address || !phone) {
                alert('Please enter both your Delivery Address and Phone Number.');
                return;
            }

            const token = localStorage.getItem('auth_token');
            errBox.style.display = 'none';
            btn.innerText = 'Connecting to SSLCommerz Gateway...';
            btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/orders/checkout/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Token ${token}`
                    },
                    body: JSON.stringify({
                        shipping_address: address,
                        phone: phone
                    })
                });

                const rawText = await res.text();
                let data = {};
                try { data = JSON.parse(rawText); } catch {}

                if (res.ok && data.payment_url) {
                    window.location.href = data.payment_url;
                } else {
                    const msg = data.error || data.detail || `Server Error (${res.status}): ${rawText.slice(0, 150)}`;
                    errBox.innerText = msg;
                    errBox.style.display = 'block';
                    alert(msg);
                    btn.innerText = '🔒 Confirm & Pay via SSLCommerz';
                    btn.disabled = false;
                }
            } catch (err) {
                const msg = 'Network error: Make sure Django server (runserver) is running.';
                errBox.innerText = msg;
                errBox.style.display = 'block';
                alert(msg);
                btn.innerText = '🔒 Confirm & Pay via SSLCommerz';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
